spring.application.name=placex-backend
server.port=${SERVER_PORT:8080}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/placex?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:placex_app}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql
spring.sql.init.continue-on-error=false

placex.admin-token=${PLACEX_ADMIN_TOKEN:my-secret-token-123}
placex.frontend-origins=${PLACEX_FRONTEND_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
spring.jackson.default-property-inclusion=non_null
